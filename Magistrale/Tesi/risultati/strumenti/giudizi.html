<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giudicare il pool</title>
<style>
  :root {
    --sfondo: #f7f6f3; --carta: #ffffff; --testo: #1d1d1b; --tenue: #6b6a66;
    --bordo: #dddbd5; --accento: #1f5fa8; --accento-testo: #ffffff; --avviso: #8a5a00;
    --bisogno: #eef3fa;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --sfondo: #1b1b1a; --carta: #252524; --testo: #ecebe7; --tenue: #a3a19b;
      --bordo: #3a3936; --accento: #6ea8ec; --accento-testo: #10243d; --avviso: #e0b050;
      --bisogno: #1f2a38;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--sfondo); color: var(--testo);
         font: 17px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.5rem; margin: 0 0 12px; }
  .passo { color: var(--tenue); font-size: .9rem; margin-bottom: 8px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .barra { height: 4px; background: var(--bordo); border-radius: 2px; margin-bottom: 14px; }
  .barra > div { height: 100%; background: var(--accento); border-radius: 2px; }
  .carta { background: var(--carta); border: 1px solid var(--bordo); border-radius: 10px; padding: 20px; }
  .bisogno { background: var(--bisogno); border-radius: 10px; padding: 14px 18px; margin-bottom: 14px; }
  .bisogno .query { font-weight: 700; font-size: 1.1rem; }
  .titolo-atto { font-weight: 600; font-size: 1.05rem; margin: 0 0 12px; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0 0 12px; }
  dt { color: var(--tenue); } dd { margin: 0; overflow-wrap: anywhere; }
  .corpo { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 55vh; overflow-y: auto;
           border-top: 1px solid var(--bordo); padding-top: 12px; font-size: .95rem; }
  input[type=text] { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--bordo);
                     border-radius: 8px; background: var(--carta); color: var(--testo); }
  label { display: block; font-weight: 600; margin: 16px 0 6px; }
  .azioni { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 18px; }
  .gradi { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 18px; }
  button { font: inherit; padding: 10px 18px; border-radius: 8px; border: 1px solid var(--accento); cursor: pointer; }
  button.primario { background: var(--accento); color: var(--accento-testo); }
  button.secondario { background: transparent; color: var(--accento); }
  button.grado { background: transparent; color: var(--testo); border-color: var(--bordo); text-align: left; padding: 12px 14px; }
  button.grado b { display: block; font-size: 1.2rem; }
  button.grado.scelto { border-color: var(--accento); outline: 2px solid var(--accento); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  table { border-collapse: collapse; width: 100%; font-size: .95rem; }
  td, th { border-top: 1px solid var(--bordo); padding: 6px 8px; text-align: left; vertical-align: top; }
  .nota { color: var(--tenue); font-size: .9rem; }
  .avviso { color: var(--avviso); font-weight: 600; }
  ul { padding-left: 20px; }
  [hidden] { display: none !important; }
  @media (max-width: 560px) { .gradi { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main id="app"></main>
<script>
const DATI = /*DATI*/null;
const CHIAVE = `giudizi-${DATI.ruolo}-${DATI.impronta}`;
const UN_ORA = 60 * 60 * 1000;
const query = Object.fromEntries(DATI.query.map((q) => [q.id, q]));
const app = document.getElementById("app");
let stato = carica() || { fase: "intro", indice: 0, gradi: {}, sessioni: [], corrente: null };
let mostrato = performance.now();

function carica() {
  try { return JSON.parse(localStorage.getItem(CHIAVE)); } catch (e) { return null; }
}
function salva() {
  try { localStorage.setItem(CHIAVE, JSON.stringify(stato)); } catch (e) { /* senza memoria si va avanti lo stesso */ }
}
function el(tag, attributi = {}, ...figli) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attributi)) {
    if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else if (v !== false) e.setAttribute(k, v === true ? "" : v);
  }
  for (const f of figli.flat(Infinity)) if (f !== null && f !== undefined) e.append(f);
  return e;
}
function adesso() { return new Date().toISOString(); }
function dati() { return Object.keys(stato.gradi).length; }

// Una sessione va dal primo giudizio dopo l'apertura (o una pausa) all'ultimo.
function chiudiSessione() {
  if (stato.corrente && stato.corrente.giudizi > 0) stato.sessioni.push(stato.corrente);
  stato.corrente = null;
}
function segnaSessione(riga) {
  if (!stato.corrente) stato.corrente = { inizio: adesso(), fine: null, prima: riga + 1, ultima: riga + 1, giudizi: 0 };
  stato.corrente.fine = adesso();
  stato.corrente.ultima = riga + 1;
  stato.corrente.giudizi += 1;
}
function vai(fase) { stato.fase = fase; salva(); disegna(); }

function scala() {
  return el("table", {},
    el("tr", {}, el("th", {}, "Grado"), el("th", {}, "Significato")),
    el("tr", {}, el("td", {}, el("b", {}, "2")), el("td", {}, "Risponde al bisogno per intero: è un atto che chi cerca vuole trovare.")),
    el("tr", {}, el("td", {}, el("b", {}, "1")), el("td", {}, "Pertinente ma parziale: tocca il bisogno e chi cerca lo vorrebbe vedere, ma non basta da solo.")),
    el("tr", {}, el("td", {}, el("b", {}, "0")), el("td", {}, "Non risponde, anche se contiene le parole della query.")));
}

function intro() {
  const ripresa = dati() > 0;
  return [
    el("h1", {}, "Giudicare il pool"),
    el("div", { class: "carta" },
      el("p", {}, `${DATI.righe.length} atti da giudicare su ${DATI.query.length} query. Per ogni query vedi il bisogno che hai scritto, poi un atto alla volta.`),
      scala(),
      el("ul", {},
        el("li", {}, "Si giudica l'atto, non le parole: un atto con tutte le parole della query che parla d'altro vale 0; uno senza le parole che risponde vale 1 o 2."),
        el("li", {}, "Un atto e la sua rettifica si giudicano ciascuno per conto proprio. Un comune diverso non abbassa il grado, se la query non ne nomina uno."),
        el("li", {}, "Se il riassunto non basta, apri il testo intero. Nel dubbio fra due gradi, il più basso, e una nota."),
        el("li", {}, "Gli atti sono in ordine di numero, non di ranking, e non sai quale motore li ha trovati: è voluto."),
        el("li", {}, "Tasti: 0, 1, 2 per il grado, T per il testo intero, freccia a sinistra per tornare indietro."),
        el("li", {}, "Sessioni di un'ora al massimo: dopo, i giudizi peggiorano senza accorgersene. Premi Pausa quando smetti."),
        el("li", {}, "Si ricorda dove eri, sempre da questo browser. Alla fine scarichi un file e lo metti in risposte/.")),
      ripresa ? el("p", {}, `Hai già dato ${dati()} giudizi su ${DATI.righe.length}.`) : null,
      el("div", { class: "azioni" }, el("button", { class: "primario", onclick: () => vai("giudica") }, ripresa ? "Riprendi" : "Comincia"))),
  ];
}

function giudica() {
  const [qid, doc] = DATI.righe[stato.indice];
  const q = query[qid];
  const a = DATI.atti[doc];
  const righeQuery = DATI.righe.map((r, i) => [r, i]).filter(([r]) => r[0] === qid);
  const posizione = righeQuery.findIndex(([, i]) => i === stato.indice) + 1;
  const giaDato = stato.gradi[stato.indice];
  const nota = el("input", { type: "text", id: "nota", autocomplete: "off", value: giaDato ? giaDato.nota : "" });
  const corpo = a.testo ? el("div", { class: "corpo", hidden: true }, a.testo) : null;
  const apri = a.testo ? el("button", { class: "secondario", onclick: () => { corpo.hidden = !corpo.hidden; apri.textContent = corpo.hidden ? "Mostra il testo intero" : "Nascondi il testo intero"; } }, "Mostra il testo intero") : null;
  const durata = stato.corrente ? Date.now() - Date.parse(stato.corrente.inizio) : 0;
  const bottone = (g, titolo) => el("button", { class: "grado" + (giaDato && giaDato.grado === g ? " scelto" : ""), onclick: () => registra(g, nota.value.trim()) },
    el("b", {}, String(g)), titolo);
  mostrato = performance.now();
  return [
    el("div", { class: "passo" },
      el("span", {}, `Query ${DATI.query.indexOf(q) + 1} di ${DATI.query.length} · atto ${posizione} di ${righeQuery.length}`),
      el("span", {}, `${dati()} giudizi su ${DATI.righe.length}`)),
    el("div", { class: "barra" }, el("div", { style: `width:${(100 * dati() / DATI.righe.length).toFixed(1)}%` })),
    durata > UN_ORA ? el("p", { class: "avviso" }, "Sei oltre un'ora di sessione: fai una pausa.") : null,
    el("div", { class: "bisogno" }, el("div", { class: "query" }, q.testo), el("div", {}, q.bisogno)),
    el("div", { class: "carta" },
      el("p", { class: "titolo-atto" }, a.titolo),
      a.righe.length ? el("dl", {}, a.righe.map(([k, v]) => [el("dt", {}, k), el("dd", {}, v)])) : null,
      apri, corpo,
      el("div", { class: "gradi" }, bottone(0, "Non risponde"), bottone(1, "Parziale"), bottone(2, "Risponde")),
      el("label", { for: "nota" }, "Nota (facoltativa: un dubbio, perché il grado più basso)"),
      nota,
      el("div", { class: "azioni" },
        el("button", { class: "secondario", disabled: stato.indice === 0, onclick: indietro }, "Indietro"),
        el("button", { class: "secondario", onclick: pausa }, "Pausa"))),
  ];
}

function registra(grado, nota) {
  const secondi = Math.round((performance.now() - mostrato) / 100) / 10;
  const prima = stato.gradi[stato.indice];
  stato.gradi[stato.indice] = { grado, nota, secondi: prima ? prima.secondi + secondi : secondi, cambiato: prima ? prima.grado !== grado || !!prima.cambiato : false };
  segnaSessione(stato.indice);
  const libera = DATI.righe.findIndex((_, i) => i > stato.indice && !(i in stato.gradi));
  const qualsiasi = DATI.righe.findIndex((_, i) => !(i in stato.gradi));
  if (qualsiasi < 0) { chiudiSessione(); vai("fine"); return; }
  stato.indice = libera >= 0 ? libera : qualsiasi;
  vai("giudica");
}
function indietro() { if (stato.indice > 0) { stato.indice -= 1; vai("giudica"); } }
function pausa() { chiudiSessione(); vai("pausa"); }

function contenuto() {
  return {
    strumento: "giudizi-pool", versione: 1, ruolo: DATI.ruolo, impronta: DATI.impronta, scaricato: adesso(),
    gradi: Object.entries(stato.gradi).map(([i, g]) => ({ riga: Number(i) + 1, query: DATI.righe[i][0], atto: DATI.righe[i][1], ...g }))
      .sort((x, y) => x.riga - y.riga),
    sessioni: stato.sessioni,
  };
}
function scarica() {
  const url = URL.createObjectURL(new Blob([JSON.stringify(contenuto(), null, 2)], { type: "application/json" }));
  const link = el("a", { href: url, download: `giudizi-${DATI.ruolo}.json` });
  document.body.append(link); link.click(); link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function schermataPausa() {
  return [
    el("h1", {}, "In pausa"),
    el("div", { class: "carta" },
      el("p", {}, `${dati()} giudizi su ${DATI.righe.length}. La sessione è chiusa; riprendendo ne comincia una nuova.`),
      el("p", { class: "nota" }, "Se vuoi, scarica i giudizi fin qui: non serve, la pagina se li ricorda, ma è una copia di sicurezza."),
      el("div", { class: "azioni" },
        el("button", { class: "primario", onclick: () => vai("giudica") }, "Riprendi"),
        el("button", { class: "secondario", onclick: scarica }, "Scarica i giudizi fin qui"))),
  ];
}

function fine() {
  const conta = [0, 1, 2].map((g) => Object.values(stato.gradi).filter((x) => x.grado === g).length);
  return [
    el("h1", {}, "Finito"),
    el("div", { class: "carta" },
      el("p", {}, `Hai dato tutti i ${DATI.righe.length} giudizi: ${conta[2]} da 2, ${conta[1]} da 1, ${conta[0]} da 0.`),
      el("p", {}, "Scarica il file e mettilo così com'è in query/confronto-24/risposte/."),
      el("div", { class: "azioni" },
        el("button", { class: "primario", id: "scarica", onclick: scarica }, "Scarica il file"),
        el("button", { class: "secondario", onclick: () => { stato.indice = 0; vai("giudica"); } }, "Rivedi dall'inizio"))),
  ];
}

function disegna() {
  const schermate = { intro, giudica, pausa: schermataPausa, fine };
  app.replaceChildren(...schermate[stato.fase]());
  window.scrollTo(0, 0);
}

document.addEventListener("keydown", (e) => {
  if (stato.fase !== "giudica" || e.target.id === "nota") return;
  if (["0", "1", "2"].includes(e.key)) registra(Number(e.key), document.getElementById("nota").value.trim());
  else if (e.key === "ArrowLeft") indietro();
  else if (e.key.toLowerCase() === "t") { const b = [...document.querySelectorAll("button.secondario")].find((x) => x.textContent.includes("testo intero")); if (b) b.click(); }
});
// Riaprire la pagina chiude la sessione rimasta aperta: il tempo fra la
// chiusura e la riapertura non è lavoro.
if (stato.corrente) { chiudiSessione(); salva(); }
if (stato.fase === "giudica" || stato.fase === "pausa") stato.fase = "intro";
disegna();
</script>
</body>
</html>
